name: app-server

services:
  cliproxyapi:
    image: eceasy/cli-proxy-api:latest
    container_name: cliproxyapi
    network_mode: host
    volumes:
      - cliproxyapi_data:/CLIProxyAPI # config.yaml
      - cliproxyapi_auth:/root/.cli-proxy-api # Claude OAuth tokens
    restart: unless-stopped

  ai-toolbox:
    image: ghcr.io/soumojjalsen/ai-toolbox:latest
    container_name: ai-toolbox
    network_mode: host
    env_file: /etc/ai-toolbox/.env
    volumes:
      - mcp_auth:/root/.mcp-auth # Groww/Kite OAuth tokens
    restart: unless-stopped
    depends_on:
      - cliproxyapi

  n8n:
    image: n8nio/n8n
    container_name: n8n
    network_mode: host
    volumes:
      - n8n_data:/home/node/.n8n # workflows, credentials, settings
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile # routing config
      - caddy_data:/data # TLS certs (for future HTTPS)
    restart: unless-stopped

volumes:
  caddy_data:
  n8n_data:
  cliproxyapi_data:
  cliproxyapi_auth:
  mcp_auth:
