name: app-server

services:
  ai-toolbox:
    image: ghcr.io/soumojjalsen/ai-toolbox:latest
    container_name: ai-toolbox
    network_mode: host
    env_file: /etc/ai-toolbox/.env
    volumes:
      - mcp_auth:/root/.mcp-auth # Groww/Kite OAuth tokens
    restart: unless-stopped

  n8n:
    image: n8nio/n8n
    container_name: n8n
    network_mode: host
    environment:
      - N8N_SECURE_COOKIE=false # Allow cookies over HTTP (no HTTPS yet)
      - GENERIC_TIMEZONE=Asia/Kolkata # Cron triggers use IST
    volumes:
      - n8n_data:/home/node/.n8n # workflows, credentials, settings
    restart: unless-stopped

  caddy: # Reverse proxy — routes incoming traffic to the right service
    image: caddy:2-alpine # Caddy v2 on Alpine Linux (lightweight)
    container_name: caddy
    network_mode: host # Shares VM's network — so Caddyfile's reverse_proxy localhost:3000/:5678 works
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile # Host file mount — your routing config from the repo
      - caddy_data:/data # Named volume — Caddy stores TLS certificates here (for future HTTPS)
    restart: unless-stopped

volumes:
  n8n_data:
  mcp_auth:
  caddy_data:
